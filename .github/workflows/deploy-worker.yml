name: Deploy Worker

on:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-worker:
    name: Validate worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

  deploy-worker:
    name: Deploy worker
    runs-on: ubuntu-latest
    needs: validate-worker
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.WORKER_REMOTE_HOST }}
          username: ${{ secrets.WORKER_REMOTE_USER }}
          key: ${{ secrets.WORKER_SSH_PRIVATE_KEY }}
          script: |
            set -e

            APP_DIR="${{ secrets.WORKER_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then
              echo "WORKER_APP_DIR is not set" >&2
              exit 1
            fi

            REPO_URL="https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

            mkdir -p "$APP_DIR"

            if [ -d "$APP_DIR/.git" ]; then
              cd "$APP_DIR"
              git remote set-url origin "$REPO_URL"
              git pull origin main
            else
              if [ -n "$(ls -A "$APP_DIR" 2>/dev/null || true)" ]; then
                echo "Directory exists but is not empty and is not a git repository: $APP_DIR" >&2
                exit 1
              fi
              git clone "$REPO_URL" "$APP_DIR"
              cd "$APP_DIR"
            fi

            docker compose up -d --build
