name: Deploy Worker

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - "weave-worker/**"
      - "compose.worker.yml"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-worker:
    name: Validate worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weave-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: weave-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

  build-images:
    name: Build & Push Worker Image
    runs-on: ubuntu-latest
    needs: [validate-worker]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/weave-worker
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push worker image
        uses: docker/build-push-action@v5
        with:
          context: ./weave-worker
          file: ./weave-worker/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy worker
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        env:
          WORKER_REMOTE_HOST: ${{ secrets.WORKER_REMOTE_HOST }}
          WORKER_REMOTE_USER: ${{ secrets.WORKER_REMOTE_USER }}
          WORKER_SSH_PRIVATE_KEY: ${{ secrets.WORKER_SSH_PRIVATE_KEY }}
          WORKER_APP_DIR: ${{ secrets.WORKER_APP_DIR }}
          WORKER_DOPPLER_TOKEN: ${{ secrets.WORKER_DOPPLER_TOKEN }}
        run: |
          set -e
          [ -n "$WORKER_REMOTE_HOST" ] || { echo "Missing secret: WORKER_REMOTE_HOST" >&2; exit 1; }
          [ -n "$WORKER_REMOTE_USER" ] || { echo "Missing secret: WORKER_REMOTE_USER" >&2; exit 1; }
          [ -n "$WORKER_SSH_PRIVATE_KEY" ] || { echo "Missing secret: WORKER_SSH_PRIVATE_KEY" >&2; exit 1; }
          [ -n "$WORKER_APP_DIR" ] || { echo "Missing secret: WORKER_APP_DIR" >&2; exit 1; }
          [ -n "$WORKER_DOPPLER_TOKEN" ] || { echo "Missing secret: WORKER_DOPPLER_TOKEN" >&2; exit 1; }

      - name: Create App Directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.WORKER_REMOTE_HOST }}
          username: ${{ secrets.WORKER_REMOTE_USER }}
          key: ${{ secrets.WORKER_SSH_PRIVATE_KEY }}
          script: |
            mkdir -p "${{ secrets.WORKER_APP_DIR }}"

      - name: Copy Compose file via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.WORKER_REMOTE_HOST }}
          username: ${{ secrets.WORKER_REMOTE_USER }}
          key: ${{ secrets.WORKER_SSH_PRIVATE_KEY }}
          source: "compose.worker.yml"
          target: ${{ secrets.WORKER_APP_DIR }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.WORKER_REMOTE_HOST }}
          username: ${{ secrets.WORKER_REMOTE_USER }}
          key: ${{ secrets.WORKER_SSH_PRIVATE_KEY }}
          script: |
            set -e

            APP_DIR="${{ secrets.WORKER_APP_DIR }}"
            cd "$APP_DIR"

            # Create or update .env file
            echo "DOPPLER_TOKEN=${{ secrets.WORKER_DOPPLER_TOKEN }}" > .env

            # Non-interactive SSH often skips login PATH (e.g. Docker in /usr/local or snap).
            [ -f /etc/profile ] && . /etc/profile
            [ -f "$HOME/.profile" ] && . "$HOME/.profile"
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/snap/bin:$PATH"


            # Authenticate with GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
              COMPOSE="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE="docker-compose"
            else
              echo "Docker not found or Compose plugin missing. On the server, install Docker Engine" >&2
              echo "and ensure 'docker compose' works for this SSH user (same as in an interactive shell)." >&2
              exit 127
            fi

            echo "▶ Pulling worker image..."
            $COMPOSE -f compose.worker.yml pull

            echo "▶ Deploying worker..."
            $COMPOSE -f compose.worker.yml up -d

            # Keep cleanup bounded so deploy does not hit SSH action timeout.
            if command -v timeout > /dev/null 2>&1; then
              timeout 60s docker image prune -f || true
              timeout 60s docker builder prune -f || true
            else
              echo "Skipping Docker prune: 'timeout' command not available."
            fi

            echo "✔ Worker deployed successfully."
