name: Deploy Worker

on:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-worker:
    name: Validate worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

  deploy-worker:
    name: Deploy worker
    runs-on: ubuntu-latest
    needs: validate-worker
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.WORKER_REMOTE_HOST }}
          username: ${{ secrets.WORKER_REMOTE_USER }}
          key: ${{ secrets.WORKER_SSH_PRIVATE_KEY }}
          script: |
            set -e

            REPO_URL="https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

            if [ ! -d "${{ secrets.WORKER_APP_DIR }}" ]; then
              git clone $REPO_URL "${{ secrets.WORKER_APP_DIR }}"
              cd "${{ secrets.WORKER_APP_DIR }}"
            else
              cd "${{ secrets.WORKER_APP_DIR }}"
              git remote set-url origin $REPO_URL
              git pull origin main
            fi

            docker compose up -d --build
