name: Deploy Worker

on:
  push:
    branches:
      - main
    paths:
      - "weave-worker/**"
      - "compose.worker.yml"
      - "docs/vault-deploy.md"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-worker:
    name: Validate worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weave-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: weave-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

  deploy-worker:
    name: Deploy worker
    runs-on: ubuntu-latest
    needs: validate-worker
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Validate deploy secrets
        env:
          WORKER_REMOTE_HOST: ${{ secrets.WORKER_REMOTE_HOST }}
          WORKER_REMOTE_USER: ${{ secrets.WORKER_REMOTE_USER }}
          WORKER_SSH_PRIVATE_KEY: ${{ secrets.WORKER_SSH_PRIVATE_KEY }}
          WORKER_APP_DIR: ${{ secrets.WORKER_APP_DIR }}
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
          VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
          WORKER_VAULT_SECRET_PATH: ${{ secrets.WORKER_VAULT_SECRET_PATH }}
        run: |
          set -e
          [ -n "$WORKER_REMOTE_HOST" ] || { echo "Missing secret: WORKER_REMOTE_HOST" >&2; exit 1; }
          [ -n "$WORKER_REMOTE_USER" ] || { echo "Missing secret: WORKER_REMOTE_USER" >&2; exit 1; }
          [ -n "$WORKER_SSH_PRIVATE_KEY" ] || { echo "Missing secret: WORKER_SSH_PRIVATE_KEY" >&2; exit 1; }
          [ -n "$WORKER_APP_DIR" ] || { echo "Missing secret: WORKER_APP_DIR" >&2; exit 1; }
          if [ -n "$VAULT_ADDR" ] || [ -n "$VAULT_ROLE_ID" ] || [ -n "$VAULT_SECRET_ID" ] || [ -n "$WORKER_VAULT_SECRET_PATH" ]; then
            [ -n "$VAULT_ADDR" ] || { echo "Missing secret: VAULT_ADDR" >&2; exit 1; }
            [ -n "$VAULT_ROLE_ID" ] || { echo "Missing secret: VAULT_ROLE_ID" >&2; exit 1; }
            [ -n "$VAULT_SECRET_ID" ] || { echo "Missing secret: VAULT_SECRET_ID" >&2; exit 1; }
            [ -n "$WORKER_VAULT_SECRET_PATH" ] || { echo "Missing secret: WORKER_VAULT_SECRET_PATH" >&2; exit 1; }
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.WORKER_REMOTE_HOST }}
          username: ${{ secrets.WORKER_REMOTE_USER }}
          key: ${{ secrets.WORKER_SSH_PRIVATE_KEY }}
          script: |
            set -e

            APP_DIR="${{ secrets.WORKER_APP_DIR }}"
            VAULT_ADDR="${{ secrets.VAULT_ADDR }}"
            VAULT_ROLE_ID="${{ secrets.VAULT_ROLE_ID }}"
            VAULT_SECRET_ID="${{ secrets.VAULT_SECRET_ID }}"
            VAULT_SECRET_PATH="${{ secrets.WORKER_VAULT_SECRET_PATH }}"
            if [ -z "$APP_DIR" ]; then
              echo "WORKER_APP_DIR is not set" >&2
              exit 1
            fi

            REPO_URL="https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

            mkdir -p "$APP_DIR"
            cd "$APP_DIR"
            if [ -d ".git" ]; then
              git remote set-url origin "$REPO_URL"
            else
              git init
              git remote add origin "$REPO_URL"
            fi
            git fetch origin
            git checkout -B main origin/main
            git reset --hard origin/main

            # Non-interactive SSH often skips login PATH (e.g. Docker in /usr/local or snap).
            [ -f /etc/profile ] && . /etc/profile
            [ -f "$HOME/.profile" ] && . "$HOME/.profile"
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/snap/bin:$PATH"

            if [ -n "$VAULT_ADDR" ] && [ -n "$VAULT_ROLE_ID" ] && [ -n "$VAULT_SECRET_ID" ] && [ -n "$VAULT_SECRET_PATH" ]; then
              echo "Generating weave-worker/.env from Vault..."
              LOGIN_RESPONSE="$(curl -fsS --request POST --header "Content-Type: application/json" --data "{\"role_id\":\"$VAULT_ROLE_ID\",\"secret_id\":\"$VAULT_SECRET_ID\"}" "$VAULT_ADDR/v1/auth/approle/login")"
              VAULT_TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["auth"]["client_token"])' <<<"$LOGIN_RESPONSE")"
              SECRET_RESPONSE="$(curl -fsS --header "X-Vault-Token: $VAULT_TOKEN" "$VAULT_ADDR/v1/$VAULT_SECRET_PATH")"
              mkdir -p weave-worker
              python3 -c 'import json,sys; data=json.load(sys.stdin)["data"]["data"]; [print(f"{k}={v}") for k,v in data.items()]' <<<"$SECRET_RESPONSE" > weave-worker/.env
              chmod 600 weave-worker/.env
            else
              [ -f weave-worker/.env ] || { echo "weave-worker/.env not found and Vault is not configured" >&2; exit 1; }
            fi

            if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
              docker compose -f compose.worker.yml up -d --build
            elif command -v docker-compose >/dev/null 2>&1; then
              docker-compose -f compose.worker.yml up -d --build
            else
              echo "Docker not found or Compose plugin missing. On the server, install Docker Engine" >&2
              echo "and ensure 'docker compose' works for this SSH user (same as in an interactive shell)." >&2
              exit 127
            fi
