name: Deploy Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - "weave-api/**"
      - "weave-engine/**"
      - "weave-worker/**"
      - "packages/**"
      - "docker-compose.prod.yml"
      - "Caddyfile"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-api:
    name: Build API
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.modified, 'weave-api/') || contains(github.event.head_commit.modified, 'packages/') || contains(github.event.head_commit.modified, 'docker-compose.prod.yml') || contains(github.event.head_commit.modified, '.github/workflows/deploy.yml')
    defaults:
      run:
        working-directory: weave-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: weave-api/package-lock.json
      - run: npm ci
      - run: npm run build
      
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/weave-api
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./weave-api/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-engine:
    name: Build Engine
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.modified, 'weave-engine/') || contains(github.event.head_commit.modified, 'packages/') || contains(github.event.head_commit.modified, 'docker-compose.prod.yml') || contains(github.event.head_commit.modified, '.github/workflows/deploy.yml')
    defaults:
      run:
        working-directory: weave-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: weave-engine/package-lock.json
      - run: npm ci
      - run: npm run check
      
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/weave-engine
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./weave-engine/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-worker:
    name: Build Worker
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.modified, 'weave-worker/') || contains(github.event.head_commit.modified, 'packages/') || contains(github.event.head_commit.modified, 'docker-compose.prod.yml') || contains(github.event.head_commit.modified, '.github/workflows/deploy.yml')
    defaults:
      run:
        working-directory: weave-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: weave-worker/package-lock.json
      - run: npm ci
      - run: npm run check
      
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/weave-worker
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./weave-worker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build-api, build-engine, build-worker]
    if: always() && contains(needs.*.result, 'success') && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    
    steps:
      - uses: actions/checkout@v4

      - name: Validate deploy secrets
        env:
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          APP_DIR: ${{ secrets.APP_DIR }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -e
          [ -n "$REMOTE_HOST" ] || { echo "Missing secret: REMOTE_HOST" >&2; exit 1; }
          [ -n "$REMOTE_USER" ] || { echo "Missing secret: REMOTE_USER" >&2; exit 1; }
          [ -n "$SSH_PRIVATE_KEY" ] || { echo "Missing secret: SSH_PRIVATE_KEY" >&2; exit 1; }
          [ -n "$APP_DIR" ] || { echo "Missing secret: APP_DIR" >&2; exit 1; }
          [ -n "$DOPPLER_TOKEN" ] || { echo "Missing secret: DOPPLER_TOKEN" >&2; exit 1; }

      - name: Create App Directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p "${{ secrets.APP_DIR }}"
            mkdir -p "${{ secrets.APP_DIR }}/etc/caddy"

      - name: Copy Compose and Caddyfile via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml,Caddyfile"
          target: "${{ secrets.APP_DIR }}"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd "${{ secrets.APP_DIR }}"

            echo "DOPPLER_TOKEN=${{ secrets.DOPPLER_TOKEN }}" > .env

            [ -f /etc/profile ] && . /etc/profile
            [ -f "$HOME/.profile" ] && . "$HOME/.profile"
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/snap/bin:$PATH"

            if ! command -v docker >/dev/null 2>&1; then
              echo "Docker not found on target server. Please install Docker Engine." >&2
              exit 127
            fi

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            if docker compose version >/dev/null 2>&1; then
              COMPOSE="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE="docker-compose"
            else
              echo "Docker Compose plugin missing." >&2
              exit 127
            fi

            $COMPOSE -f docker-compose.prod.yml pull
            $COMPOSE -f docker-compose.prod.yml up -d
            
            if [ -f Caddyfile ]; then
               $COMPOSE -f docker-compose.prod.yml exec -T caddy caddy reload --config /etc/caddy/Caddyfile || true
            fi

            docker image prune -f || true
            docker builder prune -f || true
