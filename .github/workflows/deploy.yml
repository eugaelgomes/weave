name: Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to deploy (all, server, engine, worker)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - server
          - engine
          - worker
      build_web:
        description: 'Build and push web (Next.js) Docker image? Leave false if hosting frontend on Vercel/Netlify/etc.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  REGISTRY_OWNER: eugaelgomes

jobs:
  # ─────────────────────────────────────────────
  # Build jobs — run in parallel
  # ─────────────────────────────────────────────
  build-server:
    name: Build API (server)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.services == 'all' || github.event.inputs.services == 'server'))
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/weave-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./server/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-engine:
    name: Build Engine (llm)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.services == 'all' || github.event.inputs.services == 'engine'))
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/weave-engine
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./llm/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-worker:
    name: Build Worker
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.services == 'all' || github.event.inputs.services == 'worker'))
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/weave-worker
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./worker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────
  # build-web — OPTIONAL. Only runs when explicitly enabled via workflow_dispatch.
  # Self-hosters who prefer Vercel, Netlify, or any external host should leave
  # this disabled and deploy the frontend independently.
  # ─────────────────────────────────────────────────────────────────────────
  build-web:
    name: Build Web (Next.js) — optional
    runs-on: ubuntu-latest
    if: github.event.inputs.build_web == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/weave-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./web/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # Deploy — runs after all builds succeed
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-server, build-engine, build-worker, build-web]
    if: |
      always() &&
      !contains(needs.build-server.result, 'failure') &&
      !contains(needs.build-engine.result, 'failure') &&
      !contains(needs.build-worker.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          APP_DIR: ${{ secrets.APP_DIR }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -e
          [ -n "$REMOTE_HOST" ]      || { echo "❌ Missing secret: REMOTE_HOST" >&2; exit 1; }
          [ -n "$REMOTE_USER" ]      || { echo "❌ Missing secret: REMOTE_USER" >&2; exit 1; }
          [ -n "$SSH_PRIVATE_KEY" ]  || { echo "❌ Missing secret: SSH_PRIVATE_KEY" >&2; exit 1; }
          [ -n "$APP_DIR" ]          || { echo "❌ Missing secret: APP_DIR" >&2; exit 1; }
          [ -n "$DOPPLER_TOKEN" ]    || { echo "❌ Missing secret: DOPPLER_TOKEN" >&2; exit 1; }
          echo "✅ All required secrets are present."

      - name: Copy compose files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml,Caddyfile"
          target: "${{ secrets.APP_DIR }}"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd "${{ secrets.APP_DIR }}"

            # Write runtime env
            echo "DOPPLER_TOKEN=${{ secrets.DOPPLER_TOKEN }}" > .env

            # Ensure PATH is available (non-login shells on some distros)
            [ -f /etc/profile ] && . /etc/profile
            [ -f "$HOME/.profile" ] && . "$HOME/.profile"
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/snap/bin:$PATH"

            # Validate Docker
            command -v docker >/dev/null 2>&1 || { echo "❌ Docker not found on target server." >&2; exit 127; }

            # Login to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Detect compose command
            if docker compose version >/dev/null 2>&1; then
              COMPOSE="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE="docker-compose"
            else
              echo "❌ Docker Compose not found." >&2; exit 127
            fi

            echo "📦 Pulling latest images..."
            $COMPOSE -f docker-compose.prod.yml pull

            echo "🚀 Starting services..."
            $COMPOSE -f docker-compose.prod.yml up -d

            # Reload Caddy config if present
            if [ -f Caddyfile ]; then
              $COMPOSE -f docker-compose.prod.yml exec -T caddy caddy reload --config /etc/caddy/Caddyfile 2>/dev/null || true
            fi

            echo "🧹 Pruning unused images and cache..."
            docker image prune -f || true
            docker builder prune -f || true

            echo "✅ Deployment complete — version: ${{ github.ref_name }}"
