name: Deploy Engine & Worker

on:
  push:
    branches:
      - main
    paths:
      - "weave-engine/**"
      - "weave-worker/**"
      - "deploy/engine/**"
      - "deploy/worker/**"
      - ".github/workflows/deploy-engine-and-worker.yml"
      - ".github/workflows/_ci-node.yml"
      - ".github/workflows/_build-docker.yml"
      - ".github/workflows/_deploy-ssh.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-engine-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-engine:
    name: Validate Engine
    uses: ./.github/workflows/_ci-node.yml
    with:
      working_directory: weave-engine
      command: npm run check

  validate-worker:
    name: Validate Worker
    uses: ./.github/workflows/_ci-node.yml
    with:
      working_directory: weave-worker
      command: npm run check

  build-engine-image:
    name: Build Engine Image
    needs: validate-engine
    uses: ./.github/workflows/_build-docker.yml
    with:
      context: ./weave-engine
      file: ./weave-engine/Dockerfile
      image_name: ghcr.io/${{ github.repository_owner }}/weave-engine
    secrets: inherit

  build-worker-image:
    name: Build Worker Image
    needs: validate-worker
    uses: ./.github/workflows/_build-docker.yml
    with:
      context: ./weave-worker
      file: ./weave-worker/Dockerfile
      image_name: ghcr.io/${{ github.repository_owner }}/weave-worker
    secrets: inherit

  deploy-validation:
    name: Deploy Validation
    runs-on: ubuntu-latest
    needs: [build-engine-image, build-worker-image]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Validate deploy secrets
        env:
          ENGINE_REMOTE_HOST: ${{ secrets.ENGINE_REMOTE_HOST }}
          ENGINE_REMOTE_USER: ${{ secrets.ENGINE_REMOTE_USER }}
          ENGINE_SSH_PRIVATE_KEY: ${{ secrets.ENGINE_SSH_PRIVATE_KEY }}
          ENGINE_APP_DIR: ${{ secrets.ENGINE_APP_DIR }}
          DOPPLER_TOKEN_WEAVE_ENGINE: ${{ secrets.DOPPLER_TOKEN_WEAVE_ENGINE }}
          DOPPLER_TOKEN_WEAVE_WORKER: ${{ secrets.DOPPLER_TOKEN_WEAVE_WORKER }}
        run: |
          set -e
          [ -n "$ENGINE_REMOTE_HOST" ] || { echo "Missing secret: ENGINE_REMOTE_HOST" >&2; exit 1; }
          [ -n "$ENGINE_REMOTE_USER" ] || { echo "Missing secret: ENGINE_REMOTE_USER" >&2; exit 1; }
          [ -n "$ENGINE_SSH_PRIVATE_KEY" ] || { echo "Missing secret: ENGINE_SSH_PRIVATE_KEY" >&2; exit 1; }
          [ -n "$ENGINE_APP_DIR" ] || { echo "Missing secret: ENGINE_APP_DIR" >&2; exit 1; }
          [ -n "$DOPPLER_TOKEN_WEAVE_ENGINE" ] || { echo "Missing secret: DOPPLER_TOKEN_WEAVE_ENGINE" >&2; exit 1; }
          [ -n "$DOPPLER_TOKEN_WEAVE_WORKER" ] || { echo "Missing secret: DOPPLER_TOKEN_WEAVE_WORKER" >&2; exit 1; }

  deploy-action:
    name: Execute Deploy
    needs: deploy-validation
    uses: ./.github/workflows/_deploy-ssh.yml
    with:
      scp_source: "deploy/engine,deploy/worker"
      scp_target: ${{ secrets.ENGINE_APP_DIR }}
      scp_strip_components: 1
      ssh_script: |
        set -e
        APP_DIR="${{ secrets.ENGINE_APP_DIR }}"
        cd "$APP_DIR"

        [ -f /etc/profile ] && . /etc/profile
        [ -f "$HOME/.profile" ] && . "$HOME/.profile"
        export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/snap/bin:$PATH"

        echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

        if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
          COMPOSE="docker compose"
        elif command -v docker-compose >/dev/null 2>&1; then
          COMPOSE="docker-compose"
        else
          echo "Docker not found or Compose plugin missing." >&2
          exit 127
        fi

        export GHCR_OWNER="${{ github.repository_owner }}"

        echo "▶ Deploying engine..."
        cd "$APP_DIR/engine"
        export DOPPLER_TOKEN="${{ secrets.DOPPLER_TOKEN_WEAVE_ENGINE }}"
        $COMPOSE pull
        $COMPOSE up -d

        echo "▶ Deploying worker..."
        cd "$APP_DIR/worker"
        export DOPPLER_TOKEN="${{ secrets.DOPPLER_TOKEN_WEAVE_WORKER }}"
        $COMPOSE pull
        $COMPOSE up -d

        if command -v timeout > /dev/null 2>&1; then
          timeout 60s docker image prune -f || true
        fi

        echo "✔ Engine & Worker deployed successfully."
    secrets:
      remote_host: ${{ secrets.ENGINE_REMOTE_HOST }}
      remote_user: ${{ secrets.ENGINE_REMOTE_USER }}
      ssh_private_key: ${{ secrets.ENGINE_SSH_PRIVATE_KEY }}
