name: Deploy via SSH

on:
  workflow_call:
    inputs:
      scp_source:
        description: 'Files to copy via SCP (comma separated)'
        required: true
        type: string
      scp_target:
        description: 'Target directory on remote host'
        required: true
        type: string
      scp_strip_components:
        description: 'Strip components for SCP'
        required: false
        type: number
        default: 0
      ssh_script:
        description: 'Bash script to execute via SSH'
        required: true
        type: string
      ssh_envs:
        description: 'Comma-separated list of environment variables to pass to SSH script'
        required: false
        type: string
        default: ''
    secrets:
      remote_host:
        required: true
      remote_user:
        required: true
      ssh_private_key:
        required: true
      # Permite passar secrets adicionais (usando secrets: inherit no chamador)
      # Qualquer secret que precise ser exportada para o script via env deve ser
      # adicionada como var de ambiente no job, mas o action ssh_action precisa do envs declarado.

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.remote_host }}
          username: ${{ secrets.remote_user }}
          key: ${{ secrets.ssh_private_key }}
          source: ${{ inputs.scp_source }}
          target: ${{ inputs.scp_target }}
          strip_components: ${{ inputs.scp_strip_components }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        # Os environment variables específicos do script precisarão ser injetados pelo job chamador,
        # MAS o reusable workflow não tem acesso aos secrets do chamador, a menos que ele use secrets: inherit e nós
        # mapeemos diretamente aqui. Contudo, appleboy/ssh-action permite receber variáveis via config.
        # Para evitar problemas com env, faremos o script passar as envs manualmente caso precisemos.
        # Ou melhor, já que o deploy envolve DOPPLER_TOKENs que são secrets e não podem ser impressas no log,
        # vamos usar uma abordagem onde injetamos todos os secrets disponíveis como secrets na action, 
        # e o script pode referenciá-los ou recebê-los do contexto.
        # O GitHub Actions não repassa "env" automaticamente para a action se não estiver definido no with.envs.
        #
        # A forma mais robusta é passar o env via secrets context diretamente no script gerado, 
        # ex: export DOPPLER_TOKEN_ENGINE="${{ secrets.DOPPLER_TOKEN_WEAVE_ENGINE }}"
        with:
          host: ${{ secrets.remote_host }}
          username: ${{ secrets.remote_user }}
          key: ${{ secrets.ssh_private_key }}
          script: ${{ inputs.ssh_script }}
