name: Deploy Engine

on:
  push:
    branches:
      - main
    paths:
      - "weave-engine/**"
      - ".github/workflows/deploy-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-engine:
    name: Validate engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weave-engine

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: weave-engine/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

  deploy-engine:
    name: Deploy engine
    runs-on: ubuntu-latest
    needs: validate-engine
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            APP_DIR="${{ secrets.ENGINE_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then
              echo "ENGINE_APP_DIR is not set" >&2
              exit 1
            fi

            REPO_URL="https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

            mkdir -p "$APP_DIR"
            cd "$APP_DIR"
            if [ -d ".git" ]; then
              git remote set-url origin "$REPO_URL"
            else
              git init
              git remote add origin "$REPO_URL"
            fi
            git fetch origin
            git checkout -B main origin/main
            git reset --hard origin/main

            # Non-interactive SSH often skips login PATH (e.g. Docker in /usr/local or snap).
            [ -f /etc/profile ] && . /etc/profile
            [ -f "$HOME/.profile" ] && . "$HOME/.profile"
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/snap/bin:$PATH"

            if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
              docker compose up -d --build
            elif command -v docker-compose >/dev/null 2>&1; then
              docker-compose up -d --build
            else
              echo "Docker not found or Compose plugin missing. On the server, install Docker Engine" >&2
              echo "and ensure 'docker compose' works for this SSH user (same as in an interactive shell)." >&2
              exit 127
            fi
