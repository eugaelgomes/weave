name: Deploy Server

on:
  push:
    branches:
      - main
    paths:
      - "weave-api/**"
      - "deploy/server/**"
      - ".github/workflows/deploy-server.yml"
      - ".github/workflows/_ci-node.yml"
      - ".github/workflows/_build-docker.yml"
      - ".github/workflows/_deploy-ssh.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-server:
    name: Validate
    uses: ./.github/workflows/_ci-node.yml
    with:
      working_directory: weave-api
      command: npm run build

  build-image:
    name: Build Image
    needs: validate-server
    uses: ./.github/workflows/_build-docker.yml
    with:
      context: ./weave-api
      file: ./weave-api/Dockerfile
      image_name: ghcr.io/${{ github.repository_owner }}/weave-api
    secrets: inherit

  deploy-server:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-image
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Validate deploy secrets
        env:
          WORKER_REMOTE_HOST: ${{ secrets.WORKER_REMOTE_HOST }}
          WORKER_REMOTE_USER: ${{ secrets.WORKER_REMOTE_USER }}
          WORKER_SSH_PRIVATE_KEY: ${{ secrets.WORKER_SSH_PRIVATE_KEY }}
          WORKER_APP_DIR: ${{ secrets.WORKER_APP_DIR }}
          DOPPLER_TOKEN_WEAVE_API: ${{ secrets.DOPPLER_TOKEN_WEAVE_API }}
        run: |
          set -e
          [ -n "$WORKER_REMOTE_HOST" ] || { echo "Missing secret: WORKER_REMOTE_HOST" >&2; exit 1; }
          [ -n "$WORKER_REMOTE_USER" ] || { echo "Missing secret: WORKER_REMOTE_USER" >&2; exit 1; }
          [ -n "$WORKER_SSH_PRIVATE_KEY" ] || { echo "Missing secret: WORKER_SSH_PRIVATE_KEY" >&2; exit 1; }
          [ -n "$WORKER_APP_DIR" ] || { echo "Missing secret: WORKER_APP_DIR" >&2; exit 1; }
          [ -n "$DOPPLER_TOKEN_WEAVE_API" ] || { echo "Missing secret: DOPPLER_TOKEN_WEAVE_API" >&2; exit 1; }

  deploy-action:
    name: Execute Deploy
    needs: deploy-server
    uses: ./.github/workflows/_deploy-ssh.yml
    with:
      scp_source: "deploy/server/docker-compose.yml,deploy/server/Caddyfile"
      scp_target: ${{ secrets.WORKER_APP_DIR }}
      scp_strip_components: 2
      ssh_script: |
        set -e
        APP_DIR="${{ secrets.WORKER_APP_DIR }}"
        cd "$APP_DIR"

        [ -f /etc/profile ] && . /etc/profile
        [ -f "$HOME/.profile" ] && . "$HOME/.profile"
        export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/snap/bin:$PATH"

        echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

        if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
          COMPOSE="docker compose"
        elif command -v docker-compose >/dev/null 2>&1; then
          COMPOSE="docker-compose"
        else
          echo "Docker not found or Compose plugin missing." >&2
          exit 127
        fi

        export DOPPLER_TOKEN="${{ secrets.DOPPLER_TOKEN_WEAVE_API }}"
        export GHCR_OWNER="${{ github.repository_owner }}"
        
        $COMPOSE pull
        $COMPOSE up -d

        docker image prune -f || true
    secrets:
      remote_host: ${{ secrets.WORKER_REMOTE_HOST }}
      remote_user: ${{ secrets.WORKER_REMOTE_USER }}
      ssh_private_key: ${{ secrets.WORKER_SSH_PRIVATE_KEY }}
