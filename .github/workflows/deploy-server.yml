name: Deploy Server

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-server:
    name: Validate server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci
        
      - name: Build
        run: npm run build

  deploy-server:
    name: Deploy server
    runs-on: ubuntu-latest
    needs: validate-server
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            APP_DIR="${{ secrets.SERVER_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then
              echo "SERVER_APP_DIR is not set" >&2
              exit 1
            fi

            REPO_URL="https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

            mkdir -p "$APP_DIR"

            if [ -d "$APP_DIR/.git" ]; then
              cd "$APP_DIR"
              git remote set-url origin "$REPO_URL"
              git pull origin main
            else
              if [ -n "$(ls -A "$APP_DIR" 2>/dev/null || true)" ]; then
                echo "Directory exists but is not empty and is not a git repository: $APP_DIR" >&2
                exit 1
              fi
              git clone "$REPO_URL" "$APP_DIR"
              cd "$APP_DIR"
            fi

            # Non-interactive SSH often skips login PATH (e.g. Docker in /usr/local or snap).
            [ -f /etc/profile ] && . /etc/profile
            [ -f "$HOME/.profile" ] && . "$HOME/.profile"
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/snap/bin:$PATH"

            if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
              docker compose up -d --build
            elif command -v docker-compose >/dev/null 2>&1; then
              docker-compose up -d --build
            else
              echo "Docker not found or Compose plugin missing. On the server, install Docker Engine" >&2
              echo "and ensure 'docker compose' works for this SSH user (same as in an interactive shell)." >&2
              exit 127
            fi