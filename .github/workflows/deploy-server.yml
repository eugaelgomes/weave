name: Deploy Server

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - "weave-api/**"
      - "compose.server.yml"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-server:
    name: Validate server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weave-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: weave-api/package-lock.json

      - name: Install dependencies
        run: npm ci
        
      - name: Build
        run: npm run build

  build-image:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: validate-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/weave-api
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: ./weave-api
          file: ./weave-api/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-server:
    name: Deploy server
    runs-on: ubuntu-latest
    needs: build-image
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        env:
          SERVER_REMOTE_HOST: ${{ secrets.SERVER_REMOTE_HOST }}
          SERVER_REMOTE_USER: ${{ secrets.SERVER_REMOTE_USER }}
          SERVER_SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          SERVER_APP_DIR: ${{ secrets.SERVER_APP_DIR }}
          SERVER_DOPPLER_TOKEN: ${{ secrets.SERVER_DOPPLER_TOKEN }}
        run: |
          set -e
          [ -n "$SERVER_REMOTE_HOST" ] || { echo "Missing secret: SERVER_REMOTE_HOST" >&2; exit 1; }
          [ -n "$SERVER_REMOTE_USER" ] || { echo "Missing secret: SERVER_REMOTE_USER" >&2; exit 1; }
          [ -n "$SERVER_SSH_PRIVATE_KEY" ] || { echo "Missing secret: SERVER_SSH_PRIVATE_KEY" >&2; exit 1; }
          [ -n "$SERVER_APP_DIR" ] || { echo "Missing secret: SERVER_APP_DIR" >&2; exit 1; }
          [ -n "$SERVER_DOPPLER_TOKEN" ] || { echo "Missing secret: SERVER_DOPPLER_TOKEN" >&2; exit 1; }

      - name: Create App Directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_REMOTE_HOST }}
          username: ${{ secrets.SERVER_REMOTE_USER }}
          key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          script: |
            APP_DIR="${{ secrets.SERVER_APP_DIR }}"
            case "$APP_DIR" in
              /root*|"") APP_DIR="/home/${{ secrets.SERVER_REMOTE_USER }}/weave-server" ;;
            esac
            mkdir -p "$APP_DIR"
            mkdir -p "$APP_DIR/etc/caddy"

      - name: Copy Compose and Caddyfile via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_REMOTE_HOST }}
          username: ${{ secrets.SERVER_REMOTE_USER }}
          key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          source: "compose.server.yml,Caddyfile"
          target: "weave-server"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_REMOTE_HOST }}
          username: ${{ secrets.SERVER_REMOTE_USER }}
          key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          script: |
            set -e

            APP_DIR="${{ secrets.SERVER_APP_DIR }}"
            case "$APP_DIR" in
              /root*|"") APP_DIR="/home/${{ secrets.SERVER_REMOTE_USER }}/weave-server" ;;
            esac
            cd "$APP_DIR"

            # Create or update .env file
            echo "DOPPLER_TOKEN=${{ secrets.SERVER_DOPPLER_TOKEN }}" > .env

            # Non-interactive SSH often skips login PATH (e.g. Docker in /usr/local or snap).
            [ -f /etc/profile ] && . /etc/profile
            [ -f "$HOME/.profile" ] && . "$HOME/.profile"
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/snap/bin:$PATH"

            # Authenticate with GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
              docker compose -f compose.server.yml pull
              docker compose -f compose.server.yml up -d
            elif command -v docker-compose >/dev/null 2>&1; then
              docker-compose -f compose.server.yml pull
              docker-compose -f compose.server.yml up -d
            else
              echo "Docker not found or Compose plugin missing. On the server, install Docker Engine" >&2
              echo "and ensure 'docker compose' works for this SSH user (same as in an interactive shell)." >&2
              exit 127
            fi

            # Clean dangling images (old builds) and builder cache to free space without losing active cache layers
            docker image prune -f || true
            docker builder prune -f || true