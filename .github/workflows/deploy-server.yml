name: Deploy Server

on:
  push:
    branches:
      - main
    paths:
      - "weave-api/**"
      - "compose.server.yml"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-server:
    name: Validate server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weave-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: weave-api/package-lock.json

      - name: Install dependencies
        run: npm ci
        
      - name: Build
        run: npm run build

  build-image:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: validate-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: ./weave-api
          file: ./weave-api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/weave-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-server:
    name: Deploy server
    runs-on: ubuntu-latest
    needs: build-image
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Validate deploy secrets
        env:
          WORKER_REMOTE_HOST: ${{ secrets.WORKER_REMOTE_HOST }}
          WORKER_REMOTE_USER: ${{ secrets.WORKER_REMOTE_USER }}
          WORKER_SSH_PRIVATE_KEY: ${{ secrets.WORKER_SSH_PRIVATE_KEY }}
          WORKER_APP_DIR: ${{ secrets.WORKER_APP_DIR }}
        run: |
          set -e
          [ -n "$WORKER_REMOTE_HOST" ] || { echo "Missing secret: WORKER_REMOTE_HOST" >&2; exit 1; }
          [ -n "$WORKER_REMOTE_USER" ] || { echo "Missing secret: WORKER_REMOTE_USER" >&2; exit 1; }
          [ -n "$WORKER_SSH_PRIVATE_KEY" ] || { echo "Missing secret: WORKER_SSH_PRIVATE_KEY" >&2; exit 1; }
          [ -n "$WORKER_APP_DIR" ] || { echo "Missing secret: WORKER_APP_DIR" >&2; exit 1; }

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.WORKER_REMOTE_HOST }}
          username: ${{ secrets.WORKER_REMOTE_USER }}
          key: ${{ secrets.WORKER_SSH_PRIVATE_KEY }}
          script: |
            set -e

            APP_DIR="${{ secrets.WORKER_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then
              echo "WORKER_APP_DIR is not set" >&2
              exit 1
            fi

            REPO_URL="https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

            mkdir -p "$APP_DIR"
            cd "$APP_DIR"
            if [ -d ".git" ]; then
              git remote set-url origin "$REPO_URL"
            else
              git init
              git remote add origin "$REPO_URL"
            fi
            git fetch origin
            git checkout -B main origin/main
            git reset --hard origin/main

            # Non-interactive SSH often skips login PATH (e.g. Docker in /usr/local or snap).
            [ -f /etc/profile ] && . /etc/profile
            [ -f "$HOME/.profile" ] && . "$HOME/.profile"
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/snap/bin:$PATH"

            if [ ! -f .env ] && [ ! -f weave-api/.env ]; then
              echo "Need .env or weave-api/.env on VM (DOPPLER_TOKEN / runtime secrets)." >&2
              exit 1
            fi

            # Authenticate with GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
              docker compose -f compose.server.yml pull
              docker compose -f compose.server.yml up -d
            elif command -v docker-compose >/dev/null 2>&1; then
              docker-compose -f compose.server.yml pull
              docker-compose -f compose.server.yml up -d
            else
              echo "Docker not found or Compose plugin missing. On the server, install Docker Engine" >&2
              echo "and ensure 'docker compose' works for this SSH user (same as in an interactive shell)." >&2
              exit 127
            fi

            # Clean dangling images (old builds) and builder cache to free space without losing active cache layers
            docker image prune -f || true
            docker builder prune -f || true