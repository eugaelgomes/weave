services:
  mcp:
    image: ghcr.io/eugaelgomes/weave-mcp:latest
    restart: always
    env_file:
      - path: ./.env
        required: false
      - path: ./weave-mcp/.env
        required: false
    environment:
      - NODE_ENV=production
      - DOPPLER_CONFIG=prd
      - NODE_OPTIONS=--max-old-space-size=192
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    ports:
      - "8083:8083"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
