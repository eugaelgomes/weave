services:
  vault:
    image: hashicorp/vault:1.17
    restart: always
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_LOCAL_CONFIG: |
        ui = true
        listener "tcp" {
          address = "0.0.0.0:8200"
          tls_disable = 1
        }
        storage "raft" {
          path = "/vault/data"
        }
        disable_mlock = true
    volumes:
      - vault_data:/vault/data
    command: server

  engine:
    build:
      context: ./weave-engine
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ./weave-engine/.env
    environment:
      - NODE_ENV=production
    command: npm start

volumes:
  vault_data:
