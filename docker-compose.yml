services:
  # Gateway de Segurança e SSL Automático
  caddy:
    image: caddy:2
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app-network

  # Sua API Node.js
  server:
    build:
      context: ./weave-api
      dockerfile: Dockerfile
    restart: always
    env_file:
      - path: ./weave-api/.env
        required: false
    environment:
      - NODE_ENV=production
      - DOPPLER_CONFIG=prd
    networks:
      - app-network

  worker:
    build:
      context: ./weave-worker
      dockerfile: Dockerfile
    restart: always
    env_file:
      - path: ./weave-worker/.env
        required: false
    environment:
      - NODE_ENV=production
      - DOPPLER_CONFIG=prd
    networks:
      - app-network

  engine:
    build:
      context: ./weave-engine
      dockerfile: Dockerfile
    restart: always
    env_file:
      - path: ./weave-engine/.env
        required: false
    environment:
      - NODE_ENV=production
      - DOPPLER_CONFIG=prd
    networks:
      - app-network

