services:
  caddy:
    image: caddy:2
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app-network

  server:
    image: ghcr.io/eugaelgomes/weave-api:latest
    restart: always
    env_file:
      - path: ./.env
        required: false
      - path: ./weave-api/.env
        required: false
    environment:
      - NODE_ENV=production
      - DOPPLER_CONFIG=prd
      - NODE_OPTIONS=--max-old-space-size=768
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
