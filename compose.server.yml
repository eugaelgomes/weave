services:
  caddy:
    image: caddy:2
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app-network

  server:
    build:
      context: ./weave-api
      dockerfile: Dockerfile
    restart: always
    env_file:
      - path: ./weave-api/.env
        required: false
    environment:
      - NODE_ENV=production
      - DOPPLER_CONFIG=prd
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
