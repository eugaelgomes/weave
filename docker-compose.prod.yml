services:
  caddy:
    image: caddy:2
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app-network

  server:
    image: ghcr.io/eugaelgomes/weave-api:latest
    restart: always
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      - NODE_OPTIONS=--max-old-space-size=768
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - app-network

  worker:
    image: ghcr.io/eugaelgomes/weave-worker:latest
    restart: always
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "ps", "aux", "|", "grep", "node"] # Adjust healthcheck based on worker
      interval: 30s
      timeout: 10s
      retries: 3
      - NODE_OPTIONS=--max-old-space-size=384
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - app-network

  engine:
    image: ghcr.io/eugaelgomes/weave-engine:latest
    restart: always
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"] # Assuming engine has a health endpoint, otherwise use ps
      interval: 30s
      timeout: 10s
      retries: 3
      - NODE_OPTIONS=--max-old-space-size=384
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
